<!doctype html>
<html lang="it" pgs="htmlBase">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self' 'wasm-unsafe-eval';style-src 'self';img-src 'self' data: blob:;font-src 'self' data: blob:;worker-src 'self' blob:;connect-src 'self';object-src 'none';base-uri 'none';form-action 'none'">
 <title>SocialDesk</title>
 <link rel="stylesheet" href="../node_modules/mypgs/dist/css/index.min.css">
 <link rel="stylesheet" href="../node_modules/@marcix/myicons/dist/icons.min.css">
 <link rel="stylesheet" href="styles.css">
 <script src="../node_modules/mypgs/dist/javascript/index.min.js"></script>
</head>
<body pgs="body['bodyBase' 'bodyImg' 'bodyText' 'bodyHeading']">
 <header pgs="header">
  <div pgs="header-element blur">
   <div pgs="header-element-alwaysOn">
    <!-- logo e nome del cliente (home) e freccia con l'elenco dei clienti: disegnati da renderClientSlot() -->
    <div pgs="flex['row' 'itemCenter' 'nowrap']" class="brand-row" id="client-slot"></div>
   </div>
   <div pgs="header-element-onlyFull">
    <nav pgs="menu['menuHorizontal']" aria-label="Navigazione principale">
     <ul>
      <li><a pgs="button['btnTransparent' 'btnForHeader' 'btnPaddingEqual' 'btnCurrent']" href="#posts" data-nav="posts"><i pgs="icon['icon-calendar']" aria-hidden="true"></i><span>Tutti i post</span></a></li>
      <li><a pgs="button['btnTransparent' 'btnForHeader' 'btnPaddingEqual' 'btnCurrent']" href="#drafts" data-nav="drafts"><i pgs="icon['icon-fileText']" aria-hidden="true"></i><span>Post in bozza</span></a></li>
      <li><a pgs="button['btnTransparent' 'btnForHeader' 'btnPaddingEqual' 'btnCurrent']" href="#ideas" data-nav="ideas"><i pgs="icon['icon-lightbulb']" aria-hidden="true"></i><span>Idee</span></a></li>
      <li><a pgs="button['btnStrong' 'btnForHeader' 'btnCurrent']" href="#create" data-nav="create"><i pgs="icon['icon-circlePlus']" aria-hidden="true"></i><span>Crea nuovo post</span></a></li>
     </ul>
    </nav>
   </div>
   <div pgs="header-element-onlyCompact">
    <div pgs="modal['dialogRight']" pgs-data="modalContainerPGS[header]" id="compact-menu">
     <button pgs="button['btnIconOnly' 'btnForHeader'] modal-button modal-close" type="button" aria-label="Apri il menu">
      <i pgs="icon['icon-hamburgerTwo']" aria-hidden="true"></i>
     </button>
     <dialog>
      <div pgs="modal-dialog-content">
       <nav pgs="menu['menuVertical']" aria-label="Navigazione principale">
        <ul>
      <li><a pgs="button['btnTransparent' 'btnPaddingEqual' 'btnCurrent']" href="#posts" data-nav="posts"><i pgs="icon['icon-calendar']" aria-hidden="true"></i><span>Tutti i post</span></a></li>
      <li><a pgs="button['btnTransparent' 'btnPaddingEqual' 'btnCurrent']" href="#drafts" data-nav="drafts"><i pgs="icon['icon-fileText']" aria-hidden="true"></i><span>Post in bozza</span></a></li>
      <li><a pgs="button['btnTransparent' 'btnPaddingEqual' 'btnCurrent']" href="#ideas" data-nav="ideas"><i pgs="icon['icon-lightbulb']" aria-hidden="true"></i><span>Idee</span></a></li>
      <li><a pgs="button['btnStrong' 'btnCurrent']" href="#create" data-nav="create"><i pgs="icon['icon-circlePlus']" aria-hidden="true"></i><span>Crea nuovo post</span></a></li>
        </ul>
       </nav>
      </div>
     </dialog>
    </div>
   </div>
  </div>
 </header>
 <main pgs="main">
  <section pgs="section flex['column' 'gapElements']" class="app-section">
   <nav pgs="flex['row' 'wrap' 'gapParagraphs']" class="progress" aria-label="Passaggi" id="progress"></nav>
   <div pgs="flex['column' 'gapElements']" id="main"></div>
   <div pgs="flex['row' 'wrap' 'gapParagraphs' 'itemCenter' 'justifyBetween']" class="footer" id="footer"></div>
  </section>
 </main>
 <!-- footer dell'app: logo SocialDesk, impostazioni dell'app, versione e aggiornamenti (renderAppFooter) -->
 <footer pgs="footer" class="app-footer" id="app-footer"></footer>
 <!-- toast di myPgs: popover, così resta sopra anche alle modali aperte -->
 <div pgs="toast" id="toast-host" popover="manual" aria-live="polite"></div>
 <!-- Filtro per le immagini della home: prende tinta e saturazione dal colore del cliente (flood-color in styles.css)
      e tiene luci e ombre dell'immagine -->
 <svg class="svg-filters" width="0" height="0" aria-hidden="true" focusable="false"><filter id="client-tint" color-interpolation-filters="sRGB"><feFlood class="client-tint-flood" result="tinta"/><feComposite in="tinta" in2="SourceAlpha" operator="in" result="forma"/><feBlend in="forma" in2="SourceGraphic" mode="color" result="colorata"/><feComposite in="colorata" in2="SourceAlpha" operator="in"/></filter></svg>
 <script src="post-filters.js"></script>
 <script src="illustrator-preview.js"></script>
 <script src="markdown.js"></script>
 <script src="renderer.js"></script>
</body>
</html>
